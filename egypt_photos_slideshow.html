<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Egypt Mysteries - Photo Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0f2e 50%, #0f1a3e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .slideshow-container {
            max-width: 1600px;
            width: 100%;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.4), 0 0 120px rgba(100, 180, 255, 0.2);
            border: 3px solid rgba(212, 175, 55, 0.5);
        }

        .slides {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            overflow: hidden;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            animation: fadeIn 0.8s ease-in-out;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            background: linear-gradient(135deg, rgba(20, 10, 40, 0.95) 0%, rgba(10, 10, 25, 0.95) 100%);
            border-top: 3px solid rgba(212, 175, 55, 0.4);
            gap: 20px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, #d4af37, #f0e68c);
            color: #000;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        button:hover {
            background: linear-gradient(135deg, #f0e68c, #ffd700);
            transform: scale(1.08);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        .slide-counter {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
        }

        .dots {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex: 1;
            min-width: 250px;
        }

        .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(212, 175, 55, 0.2);
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .dot:hover {
            background: rgba(212, 175, 55, 0.5);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        .dot.active {
            background: #d4af37;
            transform: scale(1.3);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        @media (max-width: 768px) {
            button {
                padding: 10px 20px;
                font-size: 14px;
            }

            .slide-counter {
                font-size: 16px;
                min-width: 80px;
            }

            .controls {
                padding: 15px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="slideshow-container">
        <div class="slides">
            <!-- Slide 1: Temple of Philae -->
            <div class="slide active">
                <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3IgMeQMk8nvK4owPeWgQ4J4F9Xe/50141007-14fd-4c98-96d8-bb3673ef25c0.png" alt="Temple of Philae">
            </div>

            <!-- Slide 2: Sphinx Discovery -->
            <div class="slide">
                <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3IgMeQMk8nvK4owPeWgQ4J4F9Xe/f4b5736f-c6ae-429e-87a3-8766ccd6341e.png" alt="Sphinx Discovery">
            </div>

            <!-- Slide 3: Saqqara Royal Burials -->
            <div class="slide">
                <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3IgMeQMk8nvK4owPeWgQ4J4F9Xe/15ba4182-6b59-4d34-820e-bae8bbdde16e.png" alt="Saqqara Burials">
            </div>

            <!-- Slide 4: Eternal Secrets -->
            <div class="slide">
                <img src="https://d2ol7oe51mr4n9.cloudfront.net/user_3IgMeQMk8nvK4owPeWgQ4J4F9Xe/39fd76fc-d079-4e58-8ade-a9ecb2dbdbef.png" alt="Eternal Secrets">
            </div>
        </div>

        <div class="controls">
            <button onclick="previousSlide()">◀ PREVIOUS</button>
            <div class="dots" id="dotsContainer"></div>
            <div class="slide-counter">
                <span id="currentSlide">1</span> / <span id="totalSlides">4</span>
            </div>
            <button onclick="nextSlide()">NEXT ▶</button>
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const totalSlides = slides.length;

        // Create dots
        const dotsContainer = document.getElementById('dotsContainer');
        for (let i = 0; i < totalSlides; i++) {
            const dot = document.createElement('div');
            dot.className = 'dot' + (i === 0 ? ' active' : '');
            dot.onclick = () => goToSlide(i);
            dotsContainer.appendChild(dot);
        }

        function showSlide(n) {
            slides.forEach(slide => slide.classList.remove('active'));
            document.querySelectorAll('.dot').forEach(dot => dot.classList.remove('active'));

            slides[n].classList.add('active');
            document.querySelectorAll('.dot')[n].classList.add('active');
            document.getElementById('currentSlide').textContent = n + 1;
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % totalSlides;
            showSlide(currentSlide);
        }

        function previousSlide() {
            currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
            showSlide(currentSlide);
        }

        function goToSlide(n) {
            currentSlide = n;
            showSlide(currentSlide);
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextSlide();
            if (e.key === 'ArrowLeft') previousSlide();
        });

        // Initialize
        showSlide(0);
    </script>
</body>
</html>
